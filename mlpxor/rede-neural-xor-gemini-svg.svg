<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background-color: #0d1117; font-family: system-ui, -apple-system, sans-serif;">
  
  <text x="400" y="40" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="bold">ARQUITETURA DA REDE NEURAL MLP (2-3-1)</text>

  <!-- Conexões (Pesos / Synapses) -->
  <!-- Entrada -> Oculta -->
  <g stroke="#30363d" stroke-width="1.5" opacity="0.8">
    <!-- Entrada 1 para Oculta 1, 2, 3 -->
    <line x1="180" y1="160" x2="400" y2="100" />
    <line x1="180" y1="160" x2="400" y2="225" />
    <line x1="180" y1="160" x2="400" y2="350" />
    
    <!-- Entrada 2 para Oculta 1, 2, 3 -->
    <line x1="180" y1="290" x2="400" y2="100" />
    <line x1="180" y1="290" x2="400" y2="225" />
    <line x1="180" y1="290" x2="400" y2="350" />

    <!-- Oculta 1, 2, 3 para Saída -->
    <line x1="400" y1="100" x2="620" y2="225" stroke="#58a6ff" stroke-width="2"/>
    <line x1="400" y1="225" x2="620" y2="225" stroke="#58a6ff" stroke-width="2"/>
    <line x1="400" y1="350" x2="620" y2="225" stroke="#58a6ff" stroke-width="2"/>
  </g>

  <!-- Camada de Entrada -->
  <g>
    <circle cx="180" cy="160" r="28" fill="#161b22" stroke="#79c0ff" stroke-width="3"/>
    <text x="180" y="165" text-anchor="middle" fill="#79c0ff" font-size="14" font-weight="bold">x₁</text>
    
    <circle cx="180" cy="290" r="28" fill="#161b22" stroke="#79c0ff" stroke-width="3"/>
    <text x="180" y="295" text-anchor="middle" fill="#79c0ff" font-size="14" font-weight="bold">x₂</text>

    <text x="180" y="350" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="bold">Entrada (2)</text>
  </g>

  <!-- Camada Oculta -->
  <g>
    <circle cx="400" cy="100" r="28" fill="#161b22" stroke="#d29922" stroke-width="3"/>
    <text x="400" y="105" text-anchor="middle" fill="#d29922" font-size="14" font-weight="bold">h₁</text>

    <circle cx="400" cy="225" r="28" fill="#161b22" stroke="#d29922" stroke-width="3"/>
    <text x="400" y="230" text-anchor="middle" fill="#d29922" font-size="14" font-weight="bold">h₂</text>

    <circle cx="400" cy="350" r="28" fill="#161b22" stroke="#d29922" stroke-width="3"/>
    <text x="400" y="355" text-anchor="middle" fill="#d29922" font-size="14" font-weight="bold">h₃</text>

    <text x="400" y="410" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="bold">Oculta (3) [tanh]</text>
  </g>

  <!-- Camada de Saída -->
  <g>
    <circle cx="620" cy="225" r="28" fill="#161b22" stroke="#3fb950" stroke-width="3"/>
    <text x="620" y="230" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">y</text>

    <text x="620" y="285" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="bold">Saída (1) [sigmoid]</text>
  </g>

  <!-- Legendas Laterais / Fluxo -->
  <path d="M 80 225 L 120 225" stroke="#79c0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="60" y="230" text-anchor="end" fill="#8b949e" font-size="12">Entradas XOR</text>

  <path d="M 680 225 L 720 225" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="730" y="230" text-anchor="start" fill="#8b949e" font-size="12">Previsão (0 ou 1)</text>

</svg>
