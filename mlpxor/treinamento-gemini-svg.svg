<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #0d1117; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Título -->
  <text x="400" y="40" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="bold">FLUXO DE TREINAMENTO (Backpropagation)</text>

  <!-- Bloco 1: Dados -->
  <rect x="50" y="80" width="160" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="130" y="112" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Tabela XOR</text>
  <text x="130" y="132" text-anchor="middle" fill="#8b949e" font-size="12">Entradas &amp; Alvos</text>

  <!-- Seta 1 -> 2 -->
  <path d="M 210 115 L 280 115" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bloco 2: Forward Pass -->
  <rect x="290" y="80" width="220" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="400" y="112" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="bold">1. Forward Pass</text>
  <text x="400" y="132" text-anchor="middle" fill="#8b949e" font-size="12">Ativações (tanh / sigmoid)</text>

  <!-- Seta 2 -> 3 -->
  <path d="M 510 115 L 580 115" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bloco 3: Cálculo do Erro -->
  <rect x="590" y="80" width="160" height="70" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="670" y="112" text-anchor="middle" fill="#d29922" font-size="14" font-weight="bold">2. Cálculo do Erro</text>
  <text x="670" y="132" text-anchor="middle" fill="#8b949e" font-size="12">(Alvo - Saída)²</text>

  <!-- Seta 3 -> 4 (Desce para o Backprop) -->
  <path d="M 670 150 L 670 230" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bloco 4: Backpropagation -->
  <rect x="560" y="240" width="220" height="70" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="670" y="272" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold">3. Backpropagation</text>
  <text x="670" y="292" text-anchor="middle" fill="#8b949e" font-size="12">Ajuste dos Pesos e Biases</text>

  <!-- Loop do Treino (Looping de volta) -->
  <path d="M 560 275 L 400 275 L 400 160" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="475" y="265" text-anchor="middle" fill="#f85149" font-size="11">Repete 50.000 Épocas</text>

  <!-- Seta Decisão para Salvar Modelo -->
  <path d="M 670 310 L 670 380" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Bloco 5: Salvar JSON -->
  <rect x="560" y="390" width="220" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="670" y="422" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">4. Salvar Modelo</text>
  <text x="670" y="442" text-anchor="middle" fill="#8b949e" font-size="12">pesos_xor.json</text>
</svg>
