[package]
name = "cnncheckin"
version = "0.1.0"
edition = "2021"


[dependencies]
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ndarray = { version = "0.15", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
eframe = "0.27"
egui_extras = { version = "0.27", features = ["image"] }
image = "0.24"
rayon = "1.10"
indicatif = "0.17"
sha2 = "0.10"

csv = "1.3"
bincode = "=2.0.0-rc.3"
smartcore = "0.3"
# burn = { version = "0.13", default-features = false, features = ["std", "ndarray"] }
#burn = { version = "0.14", default-features = false, features = ["std", "ndarray"] }
# ou
burn = { version = "0.15", default-features = false, features = [
    "std",
    "ndarray",
] }

postgres = { version = "0.19", features = ["with-chrono-0_4"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
reqwest = { version = "0.12", features = ["blocking"] }
flate2 = "1.0"
r2d2 = "0.8"
r2d2_postgres = "0.18"
num_cpus = "1.16"
tempfile = "3.23"

[features]
default = []
train = []
gpu = ["burn/wgpu"]

[[bin]]
name = "cnncheckin"
path = "src/main.rs"
