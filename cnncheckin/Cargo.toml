[package]
name = "cnncheckin"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
csv = "1.3"
clap = { version = "4.5.49", features = ["derive"] }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.7"
bincode = "2.0.1"
ndarray = { version = "0.16.0", features = ["serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
rand = "0.9"
thiserror = "2.0.17"
smartcore = "0.4.4"
burn = { version = "0.17.1", default-features = false, features = ["std", "ndarray"] }
rusqlite = { version = "0.36.0", features = ["bundled"] }
log = "0.4"
env_logger = "0.11"
postgres = { version = "0.19.10", features = ["with-chrono-0_4"] }
tokio-postgres = { version = "0.7.13", features = ["with-chrono-0_4"] }
reqwest = { version = "0.12.22", features = ["blocking"] }
flate2 = "1.1.4"
rayon = "1.7"
r2d2 = "0.8"
r2d2_postgres = "0.18"
indicatif = "0.18.0"
sha2 = "0.10"
num_cpus = "1.16"
minifb = "0.28.0"
tempfile = "3.23"

[features]
default = []
train = []
gpu = ["burn/wgpu"]

[[bin]]
name = "cnncheckin"
path = "src/main.rs"